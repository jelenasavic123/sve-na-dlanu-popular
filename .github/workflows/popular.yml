name: Sve na dlanu - Popularno

on:
  workflow_dispatch:

  schedule:
    # 09:30 UTC
    # 11:30 Srbija tokom letnjeg vremena
    # 10:30 Srbija tokom zimskog vremena
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:

  popular:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. PREUZMI REPOSITORY
      # =====================================================

      - name: Preuzmi repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # 2. NODE.JS
      # =====================================================

      - name: Podesi Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      # =====================================================
      # 3. PROVERA NODE
      # =====================================================

      - name: Proveri Node.js

        run: |

          echo "=========================================="
          echo "NODE.JS"
          echo "=========================================="

          echo "Node verzija:"
          node --version

          echo ""

          echo "NPM verzija:"
          npm --version


      # =====================================================
      # 4. INSTALACIJA PAKETA
      # =====================================================

      - name: Instaliraj pakete

        run: |

          echo "=========================================="
          echo "INSTALACIJA PAKETA"
          echo "=========================================="

          npm ci


      # =====================================================
      # 5. PROVERA GOOGLE SECRET
      # =====================================================

      - name: Proveri Google Secret

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "PROVERA GOOGLE SECRET"
          echo "=========================================="

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then

            echo "❌ GRESKA:"
            echo "GOOGLE_SERVICE_ACCOUNT_JSON SECRET NIJE POSTAVLJEN!"

            exit 1

          fi

          echo "✅ Google Secret postoji."

          echo ""

          echo "Duzina Secret-a:"
          echo "${#GOOGLE_SERVICE_ACCOUNT_JSON} karaktera"

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-service-account.json


          node -e "

          const fs = require('fs');

          const file = '/tmp/google-service-account.json';

          let data;

          try {

              data = JSON.parse(
                  fs.readFileSync(file, 'utf8')
              );

          } catch (error) {

              console.error(
                  '❌ Secret nije validan JSON.'
              );

              console.error(
                  error.message
              );

              process.exit(1);

          }


          console.log(
              '✅ Google Service Account JSON je validan.'
          );


          console.log(
              'type postoji:',
              !!data.type
          );


          console.log(
              'project_id postoji:',
              !!data.project_id
          );


          console.log(
              'client_email postoji:',
              !!data.client_email
          );


          console.log(
              'private_key postoji:',
              !!data.private_key
          );


          if (!data.type) {

              console.error(
                  '❌ Nedostaje type.'
              );

              process.exit(1);

          }


          if (!data.project_id) {

              console.error(
                  '❌ Nedostaje project_id.'
              );

              process.exit(1);

          }


          if (!data.client_email) {

              console.error(
                  '❌ Nedostaje client_email.'
              );

              process.exit(1);

          }


          if (!data.private_key) {

              console.error(
                  '❌ Nedostaje private_key.'
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  'BEGIN PRIVATE KEY'
              )
          ) {

              console.error(
                  '❌ Private key nema BEGIN PRIVATE KEY.'
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  'END PRIVATE KEY'
              )
          ) {

              console.error(
                  '❌ Private key nema END PRIVATE KEY.'
              );

              process.exit(1);

          }


          console.log(
              '✅ Svi Google credentials podaci postoje.'
          );

          "


      # =====================================================
      # 6. POKRENI GA4
      # =====================================================

      - name: Pokreni popular.js

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "POKRECEM popular.js"
          echo "=========================================="

          node popular.js


      # =====================================================
      # 7. PROVERI popular.json
      # =====================================================

      - name: Proveri popular.json

        run: |

          echo "=========================================="
          echo "PROVERA popular.json"
          echo "=========================================="


          if [ ! -f popular.json ]; then

            echo "❌ GRESKA:"
            echo "popular.json nije napravljen!"

            exit 1

          fi


          echo "✅ popular.json postoji."


          echo ""


          echo "Velicina fajla:"

          wc -c popular.json


          echo ""


          echo "Sadrzaj:"

          cat popular.json


      # =====================================================
      # 8. VALIDACIJA JSON-A
      # =====================================================

      - name: Validiraj JSON

        run: |

          echo "=========================================="
          echo "VALIDACIJA JSON-A"
          echo "=========================================="


          node -e "

          const fs = require('fs');

          const data = JSON.parse(
              fs.readFileSync(
                  'popular.json',
                  'utf8'
              )
          );


          if (!Array.isArray(data.today)) {

              throw new Error(
                  'today nije niz.'
              );

          }


          if (!Array.isArray(data.last30Days)) {

              throw new Error(
                  'last30Days nije niz.'
              );

          }


          if (!Array.isArray(data.allTime)) {

              throw new Error(
                  'allTime nije niz.'
              );

          }


          const lists = [

              ['today', data.today],

              ['last30Days', data.last30Days],

              ['allTime', data.allTime]

          ];


          for (
              const [name, list]
              of lists
          ) {

              if (list.length > 10) {

                  throw new Error(
                      name +
                      ' ima vise od 10 elemenata.'
                  );

              }


              for (const item of list) {

                  if (
                      !item.id ||
                      typeof item.id !== 'string'
                  ) {

                      throw new Error(
                          name +
                          ' ima nevalidan id.'
                      );

                  }


                  if (
                      typeof item.views !== 'number'
                  ) {

                      throw new Error(
                          name +
                          ' / ' +
                          item.id +
                          ' nema numeric views.'
                      );

                  }


                  if (
                      item.views < 0
                  ) {

                      throw new Error(
                          name +
                          ' / ' +
                          item.id +
                          ' ima negativan views.'
                      );

                  }

              }

          }


          console.log(
              '✅ JSON struktura je validna.'
          );


          console.log(
              'Today:',
              data.today.length
          );


          console.log(
              'Last 30 Days:',
              data.last30Days.length
          );


          console.log(
              'All Time:',
              data.allTime.length
          );

          "


      # =====================================================
      # 9. SINHRONIZUJ REMOTE MAIN
      # =====================================================

      - name: Sinhronizuj GitHub repository

        run: |

          echo "=========================================="
          echo "SINHRONIZACIJA SA GITHUB MAIN"
          echo "=========================================="


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          echo "Preuzimam najnoviji main..."

          git fetch origin main


          echo "Pokusavam rebase..."

          git rebase origin/main


      # =====================================================
      # 10. SACUVAJ popular.json
      # =====================================================

      - name: Sacuvaj novi popular.json

        run: |

          echo "=========================================="
          echo "SACUVAVANJE popular.json"
          echo "=========================================="


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add popular.json


          if git diff --cached --quiet; then

            echo "ℹ️ Nema promena u popular.json."

            echo "GitHub push nije potreban."

          else

            echo "Promena pronadjena."

            git commit -m "Update popular.json"


            echo ""

            echo "Saljem na GitHub..."

            git push origin HEAD:main


            echo ""

            echo "✅ popular.json je uspesno poslat na GitHub."

          fi


      # =====================================================
      # 11. KRAJ
      # =====================================================

      - name: Zavrseno

        run: |

          echo ""
          echo "=========================================="
          echo "SVE NA DLANU - POPULARNO"
          echo "=========================================="

          echo "✅ GA4 podaci ucitani"
          echo "✅ popular.json napravljen"
          echo "✅ JSON validiran"
          echo "✅ GitHub repository sinhronizovan"
          echo "✅ popular.json sacuvan"

          echo ""
          echo "Sledece automatsko pokretanje:"
          echo "svakog dana u 09:30 UTC"

          echo "=========================================="
