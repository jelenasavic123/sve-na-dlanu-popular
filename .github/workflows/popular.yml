name: Sve na dlanu - Popularno

on:
  workflow_dispatch:

  schedule:
    # 09:30 UTC = 11:30 Srbija tokom letnjeg vremena
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:

  popular:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # PREUZMI REPOSITORY
      # ==========================================

      - name: Preuzmi repository

        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Podesi Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      # ==========================================
      # PROVERA NODE
      # ==========================================

      - name: Proveri Node.js

        run: |

          echo "Node verzija:"
          node --version

          echo "NPM verzija:"
          npm --version


      # ==========================================
      # INSTALACIJA
      # ==========================================

      - name: Instaliraj pakete

        run: npm ci


      # ==========================================
      # PROVERA GOOGLE SECRET
      # ==========================================

      - name: Proveri Google Secret

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GRESKA: GOOGLE_SERVICE_ACCOUNT_JSON SECRET NIJE POSTAVLJEN!"
            exit 1
          fi

          echo "Google Secret postoji."

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-service-account.json

          node -e "
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('/tmp/google-service-account.json', 'utf8')
          );

          console.log('client_email postoji:', !!data.client_email);
          console.log('private_key postoji:', !!data.private_key);

          if (!data.client_email || !data.private_key) {
            console.error('GRESKA: Secret nema client_email ili private_key.');
            process.exit(1);
          }

          console.log('Google Service Account JSON je validan.');
          "


      # ==========================================
      # GOOGLE ANALYTICS
      # ==========================================

      - name: Pokreni popular.js

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "POKRECEM popular.js"
          echo "=========================================="

          node popular.js


      # ==========================================
      # PROVERI popular.json
      # ==========================================

      - name: Proveri popular.json

        run: |

          echo "=========================================="
          echo "PROVERA popular.json"
          echo "=========================================="

          if [ ! -f popular.json ]; then
            echo "GRESKA: popular.json nije napravljen!"
            exit 1
          fi

          echo "popular.json postoji."

          echo ""
          echo "Sadrzaj:"
          cat popular.json


      # ==========================================
      # SACUVAJ popular.json
      # ==========================================

      - name: Sacuvaj novi popular.json

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add popular.json

          if git diff --cached --quiet; then

            echo "Nema promena u popular.json."

          else

            git commit -m "Update popular.json"

            git push

          fi
