name: Sve na dlanu - Popularno

on:
  workflow_dispatch:

  schedule:
    # 09:30 UTC = 11:30 Srbija tokom letnjeg vremena
    # 09:30 UTC = 10:30 Srbija tokom zimskog vremena
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:

  popular:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # PREUZMI REPOSITORY
      # ==========================================

      - name: Preuzmi repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Podesi Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      # ==========================================
      # PROVERA NODE
      # ==========================================

      - name: Proveri Node.js

        run: |

          echo "=========================================="
          echo "NODE.JS"
          echo "=========================================="

          echo "Node verzija:"
          node --version

          echo ""

          echo "NPM verzija:"
          npm --version


      # ==========================================
      # INSTALACIJA PAKETA
      # ==========================================

      - name: Instaliraj pakete

        run: |

          echo "=========================================="
          echo "INSTALACIJA PAKETA"
          echo "=========================================="

          npm ci


      # ==========================================
      # PROVERA GOOGLE SECRET
      # ==========================================

      - name: Proveri Google Secret

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "PROVERA GOOGLE SERVICE ACCOUNT"
          echo "=========================================="

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then

            echo "❌ GRESKA:"
            echo "GOOGLE_SERVICE_ACCOUNT_JSON SECRET NIJE POSTAVLJEN!"

            exit 1

          fi

          echo "✅ Google Secret postoji."

          echo ""

          echo "Proveravam JSON..."

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > /tmp/google-service-account.json

          node -e "

          const fs = require('fs');

          let data;

          try {

            data = JSON.parse(
              fs.readFileSync(
                '/tmp/google-service-account.json',
                'utf8'
              )
            );

          } catch (error) {

            console.error(
              '❌ Secret nije validan JSON.'
            );

            console.error(
              error.message
            );

            process.exit(1);

          }

          console.log(
            'JSON validan: DA'
          );

          console.log(
            'type postoji:',
            !!data.type
          );

          console.log(
            'project_id postoji:',
            !!data.project_id
          );

          console.log(
            'client_email postoji:',
            !!data.client_email
          );

          console.log(
            'private_key postoji:',
            !!data.private_key
          );

          if (!data.type) {

            console.error(
              '❌ Nedostaje type.'
            );

            process.exit(1);

          }

          if (!data.project_id) {

            console.error(
              '❌ Nedostaje project_id.'
            );

            process.exit(1);

          }

          if (!data.client_email) {

            console.error(
              '❌ Nedostaje client_email.'
            );

            process.exit(1);

          }

          if (!data.private_key) {

            console.error(
              '❌ Nedostaje private_key.'
            );

            process.exit(1);

          }

          if (
            !data.private_key.includes(
              'BEGIN PRIVATE KEY'
            )
          ) {

            console.error(
              '❌ Private key nema BEGIN PRIVATE KEY.'
            );

            process.exit(1);

          }

          if (
            !data.private_key.includes(
              'END PRIVATE KEY'
            )
          ) {

            console.error(
              '❌ Private key nema END PRIVATE KEY.'
            );

            process.exit(1);

          }

          console.log('');
          console.log(
            '✅ Google Service Account JSON je validan.'
          );

          "


      # ==========================================
      # POKRENI GA4
      # ==========================================

      - name: Pokreni popular.js

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "POKRECEM popular.js"
          echo "=========================================="

          node popular.js


      # ==========================================
      # PROVERI popular.json
      # ==========================================

      - name: Proveri popular.json

        run: |

          echo "=========================================="
          echo "PROVERA popular.json"
          echo "=========================================="

          if [ ! -f popular.json ]; then

            echo "❌ GRESKA:"
            echo "popular.json nije napravljen!"

            exit 1

          fi

          echo "✅ popular.json postoji."

          echo ""

          echo "Validacija JSON-a..."

          node -e "

          const fs = require('fs');

          let data;

          try {

            data = JSON.parse(
              fs.readFileSync(
                'popular.json',
                'utf8'
              )
            );

          } catch (error) {

            console.error(
              '❌ popular.json nije validan JSON.'
            );

            console.error(
              error.message
            );

            process.exit(1);

          }

          if (!Array.isArray(data.today)) {

            console.error(
              '❌ today nije niz.'
            );

            process.exit(1);

          }

          if (!Array.isArray(data.last30Days)) {

            console.error(
              '❌ last30Days nije niz.'
            );

            process.exit(1);

          }

          if (!Array.isArray(data.allTime)) {

            console.error(
              '❌ allTime nije niz.'
            );

            process.exit(1);

          }

          console.log(
            '✅ today:',
            data.today.length
          );

          console.log(
            '✅ last30Days:',
            data.last30Days.length
          );

          console.log(
            '✅ allTime:',
            data.allTime.length
          );

          console.log(
            '✅ popular.json je validan.'
          );

          "

          echo ""

          echo "SADRZAJ popular.json:"
          echo "=========================================="

          cat popular.json

          echo ""

          echo "=========================================="


      # ==========================================
      # SACUVAJ popular.json
      # ==========================================

      - name: Sacuvaj novi popular.json

        run: |

          echo "=========================================="
          echo "CUVANJE popular.json"
          echo "=========================================="

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          # ======================================
          # DODAJ JSON
          # ======================================

          git add popular.json


          # ======================================
          # PROVERI DA LI IMA PROMENA
          # ======================================

          if git diff --cached --quiet; then

            echo "ℹ️ Nema promena u popular.json."

            exit 0

          fi


          # ======================================
          # NAPRAVI COMMIT
          # ======================================

          git commit -m "Update popular.json"


          # ======================================
          # POVUCI EVENTUALNE PROMENE SA GITHUB-A
          # ======================================

          echo ""
          echo "=========================================="
          echo "SINHRONIZACIJA SA GITHUB-OM"
          echo "=========================================="

          git fetch origin main

          git rebase origin/main


          # ======================================
          # PUSH
          # ======================================

          echo ""
          echo "=========================================="
          echo "PUSH popular.json"
          echo "=========================================="

          git push origin HEAD:main


          echo ""
          echo "=========================================="
          echo "✅ popular.json JE USPESNO SACUVAN"
          echo "=========================================="
