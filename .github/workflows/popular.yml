name: Sve na dlanu - Popularno

on:
  workflow_dispatch:

  schedule:
    # 09:30 UTC
    # 11:30 Srbija tokom letnjeg vremena
    # 10:30 Srbija tokom zimskog vremena
    - cron: "30 9 * * *"

permissions:
  contents: write

jobs:

  popular:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Preuzmi repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          ref: main


      # =====================================================
      # 2. NODE.JS
      # =====================================================

      - name: Podesi Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      # =====================================================
      # 3. PROVERA NODE
      # =====================================================

      - name: Proveri Node.js

        run: |

          echo "=========================================="
          echo "NODE.JS"
          echo "=========================================="

          node --version
          npm --version


      # =====================================================
      # 4. INSTALACIJA
      # =====================================================

      - name: Instaliraj pakete

        run: |

          echo "=========================================="
          echo "INSTALACIJA PAKETA"
          echo "=========================================="

          npm ci


      # =====================================================
      # 5. GOOGLE SECRET
      # =====================================================

      - name: Proveri Google Secret

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "GOOGLE SERVICE ACCOUNT"
          echo "=========================================="

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then

            echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON NE POSTOJI."

            exit 1

          fi

          echo "✅ Google Secret postoji."

          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            > /tmp/google-service-account.json


          node - <<'NODE'

          const fs = require("fs");

          let data;

          try {

              data = JSON.parse(
                  fs.readFileSync(
                      "/tmp/google-service-account.json",
                      "utf8"
                  )
              );

          } catch (error) {

              console.error(
                  "❌ Google Service Account JSON nije validan."
              );

              console.error(
                  error.message
              );

              process.exit(1);

          }


          console.log(
              "JSON validan: DA"
          );


          console.log(
              "type:",
              !!data.type
          );


          console.log(
              "project_id:",
              !!data.project_id
          );


          console.log(
              "client_email:",
              !!data.client_email
          );


          console.log(
              "private_key:",
              !!data.private_key
          );


          if (!data.type) {

              console.error(
                  "❌ Nedostaje type."
              );

              process.exit(1);

          }


          if (!data.project_id) {

              console.error(
                  "❌ Nedostaje project_id."
              );

              process.exit(1);

          }


          if (!data.client_email) {

              console.error(
                  "❌ Nedostaje client_email."
              );

              process.exit(1);

          }


          if (!data.private_key) {

              console.error(
                  "❌ Nedostaje private_key."
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  "BEGIN PRIVATE KEY"
              )
          ) {

              console.error(
                  "❌ Private key nema BEGIN PRIVATE KEY."
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  "END PRIVATE KEY"
              )
          ) {

              console.error(
                  "❌ Private key nema END PRIVATE KEY."
              );

              process.exit(1);

          }


          console.log(
              "✅ Google Service Account JSON je potpuno validan."
          );

          NODE


      # =====================================================
      # 6. POKRENI GA4
      # =====================================================

      - name: Pokreni popular.js

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "POKRECEM popular.js"
          echo "=========================================="

          node popular.js


      # =====================================================
      # 7. PROVERI popular.json
      #
      # SADA JE DOZVOLJENO MAKSIMALNO 50 SERIJA
      # =====================================================

      - name: Proveri popular.json

        run: |

          echo "=========================================="
          echo "PROVERA popular.json"
          echo "=========================================="


          if [ ! -f popular.json ]; then

            echo "❌ popular.json NE POSTOJI."

            exit 1

          fi


          node - <<'NODE'

          const fs = require("fs");


          const MAX_ITEMS = 50;


          let data;


          try {

              data = JSON.parse(
                  fs.readFileSync(
                      "popular.json",
                      "utf8"
                  )
              );

          } catch (error) {

              console.error(
                  "❌ popular.json nije validan JSON."
              );

              console.error(
                  error.message
              );

              process.exit(1);

          }


          const lists = [
              "today",
              "last30Days",
              "allTime"
          ];


          for (const list of lists) {

              console.log("");

              console.log(
                  "------------------------------------------"
              );

              console.log(
                  "PROVERA:",
                  list
              );

              console.log(
                  "------------------------------------------"
              );


              if (!Array.isArray(data[list])) {

                  console.error(
                      `❌ ${list} nije validan niz.`
                  );

                  process.exit(1);

              }


              /*
               * =============================================
               * MAKSIMALNO 50 SERIJA
               * =============================================
               */

              if (
                  data[list].length >
                  MAX_ITEMS
              ) {

                  console.error(
                      `❌ ${list} ima vise od ${MAX_ITEMS} elemenata.`
                  );

                  process.exit(1);

              }


              /*
               * =============================================
               * PROVERA SVAKOG ELEMENTA
               * =============================================
               */

              for (
                  const item
                  of data[list]
              ) {

                  if (
                      !item ||
                      !item.id
                  ) {

                      console.error(
                          `❌ ${list} ima element bez id.`
                      );

                      process.exit(1);

                  }


                  if (
                      typeof item.views !==
                      "number"
                  ) {

                      console.error(
                          `❌ ${list}/${item.id} nema numericki views.`
                      );

                      process.exit(1);

                  }


                  if (
                      item.views < 0
                  ) {

                      console.error(
                          `❌ ${list}/${item.id} ima negativan broj pregleda.`
                      );

                      process.exit(1);

                  }

              }


              console.log(
                  `✅ ${list}: ${data[list].length}/${MAX_ITEMS}`
              );

          }


          /*
           * =============================================
           * ZAVRSNA PROVERA
           * =============================================
           */

          console.log("");

          console.log(
              "=========================================="
          );

          console.log(
              "REZULTAT PROVERE"
          );

          console.log(
              "=========================================="
          );


          console.log(
              "✅ today:",
              data.today.length
          );


          console.log(
              "✅ last30Days:",
              data.last30Days.length
          );


          console.log(
              "✅ allTime:",
              data.allTime.length
          );


          console.log(
              "✅ Maksimum po kategoriji:",
              MAX_ITEMS
          );


          console.log(
              "✅ popular.json validan."
          );


          console.log(
              "=========================================="
          );

          NODE


          echo ""

          echo "SADRZAJ popular.json:"

          echo "=========================================="

          cat popular.json

          echo ""

          echo "=========================================="


      # =====================================================
      # 8. SACUVAJ popular.json
      # =====================================================

      - name: Sacuvaj popular.json

        run: |

          echo "=========================================="
          echo "SACUVAVANJE popular.json"
          echo "=========================================="


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # =================================================
          # PROVERA TRENUTNOG BRANCH-A
          # =================================================

          echo "Trenutni branch:"

          git branch --show-current


          echo ""

          echo "Trenutni commit:"

          git rev-parse HEAD


          # =================================================
          # DODAJ JSON
          # =================================================

          git add popular.json


          # =================================================
          # AKO NEMA PROMENA
          # =================================================

          if git diff --cached --quiet; then

              echo ""

              echo "ℹ️ Nema promena u popular.json."

              exit 0

          fi


          # =================================================
          # COMMIT
          # =================================================

          git commit \
            -m "Update popular.json"


          # =================================================
          # SINHRONIZUJ SA REMOTE MAIN
          # =================================================

          echo ""

          echo "=========================================="

          echo "SINHRONIZACIJA SA REMOTE MAIN"

          echo "=========================================="


          git fetch origin main


          # =================================================
          # REBASE
          # =================================================

          git rebase origin/main


          # =================================================
          # PUSH
          # =================================================

          echo ""

          echo "=========================================="

          echo "PUSH"

          echo "=========================================="


          git push origin HEAD:main


          echo ""

          echo "=========================================="

          echo "✅ popular.json USPESNO POSLAT"

          echo "=========================================="
