name: Sve na dlanu - Popularno

on:
  workflow_dispatch:

  schedule:
    # 09:30 UTC
    # 11:30 Srbija tokom letnjeg vremena
    # 10:30 Srbija tokom zimskog vremena
    - cron: "30 9 * * *"

# =========================================================
# SAMO JEDAN WORKFLOW SME DA MENJA MAIN
# =========================================================

concurrency:
  group: popular-json-update
  cancel-in-progress: false

# =========================================================
# DOZVOLE
# =========================================================

permissions:
  contents: write

jobs:

  popular:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Preuzmi repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          persist-credentials: true


      # =====================================================
      # 2. NODE.JS
      # =====================================================

      - name: Podesi Node.js

        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm


      # =====================================================
      # 3. PROVERA NODE
      # =====================================================

      - name: Proveri Node.js

        run: |

          echo "=========================================="
          echo "NODE.JS"
          echo "=========================================="

          echo "Node:"
          node --version

          echo ""

          echo "NPM:"
          npm --version


      # =====================================================
      # 4. INSTALACIJA
      # =====================================================

      - name: Instaliraj pakete

        run: |

          echo "=========================================="
          echo "INSTALACIJA PAKETA"
          echo "=========================================="

          npm ci


      # =====================================================
      # 5. PROVERA GOOGLE SECRET
      # =====================================================

      - name: Proveri Google Secret

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "GOOGLE SERVICE ACCOUNT"
          echo "=========================================="


          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then

            echo "❌ GOOGLE_SERVICE_ACCOUNT_JSON NE POSTOJI."

            exit 1

          fi


          echo "✅ Google Secret postoji."


          echo ""


          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            > /tmp/google-service-account.json


          node <<'NODE'

          const fs = require("fs");

          const file =
              "/tmp/google-service-account.json";


          let data;


          try {

              data =
                  JSON.parse(
                      fs.readFileSync(
                          file,
                          "utf8"
                      )
                  );

          } catch (error) {

              console.error(
                  "❌ Secret nije validan JSON."
              );

              console.error(
                  error.message
              );

              process.exit(1);

          }


          console.log(
              "✅ JSON je validan."
          );


          console.log(
              "type:",
              data.type || "(nema)"
          );


          console.log(
              "project_id:",
              data.project_id || "(nema)"
          );


          console.log(
              "client_email postoji:",
              !!data.client_email
          );


          console.log(
              "private_key postoji:",
              !!data.private_key
          );


          if (!data.type) {

              console.error(
                  "❌ Nedostaje type."
              );

              process.exit(1);

          }


          if (!data.project_id) {

              console.error(
                  "❌ Nedostaje project_id."
              );

              process.exit(1);

          }


          if (!data.client_email) {

              console.error(
                  "❌ Nedostaje client_email."
              );

              process.exit(1);

          }


          if (!data.private_key) {

              console.error(
                  "❌ Nedostaje private_key."
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  "BEGIN PRIVATE KEY"
              )
          ) {

              console.error(
                  "❌ Private key nema BEGIN PRIVATE KEY."
              );

              process.exit(1);

          }


          if (
              !data.private_key.includes(
                  "END PRIVATE KEY"
              )
          ) {

              console.error(
                  "❌ Private key nema END PRIVATE KEY."
              );

              process.exit(1);

          }


          console.log(
              "✅ Google Service Account je validan."
          );

          NODE


      # =====================================================
      # 6. POKRENI popular.js
      # =====================================================

      - name: Pokreni popular.js

        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          echo "=========================================="
          echo "POKRECEM popular.js"
          echo "=========================================="

          node popular.js


      # =====================================================
      # 7. PROVERA popular.json
      # =====================================================

      - name: Proveri popular.json

        run: |

          echo "=========================================="
          echo "PROVERA popular.json"
          echo "=========================================="


          if [ ! -f popular.json ]; then

            echo "❌ popular.json NE POSTOJI."

            exit 1

          fi


          echo "✅ popular.json postoji."


          echo ""


          echo "Sadrzaj:"

          cat popular.json


      # =====================================================
      # 8. VALIDACIJA JSON-A
      # =====================================================

      - name: Validiraj popular.json

        run: |

          echo "=========================================="
          echo "VALIDACIJA popular.json"
          echo "=========================================="


          node <<'NODE'

          const fs = require("fs");


          const data =
              JSON.parse(
                  fs.readFileSync(
                      "popular.json",
                      "utf8"
                  )
              );


          const lists = [

              [
                  "today",
                  data.today
              ],

              [
                  "last30Days",
                  data.last30Days
              ],

              [
                  "allTime",
                  data.allTime
              ]

          ];


          for (
              const [name, list]
              of lists
          ) {

              if (!Array.isArray(list)) {

                  throw new Error(
                      `${name} nije niz.`
                  );

              }


              if (list.length > 10) {

                  throw new Error(
                      `${name} ima vise od 10 elemenata.`
                  );

              }


              for (const item of list) {

                  if (
                      typeof item.id !== "string" ||
                      !item.id.trim()
                  ) {

                      throw new Error(
                          `${name} ima nevalidan id.`
                      );

                  }


                  if (
                      typeof item.views !== "number" ||
                      !Number.isFinite(item.views)
                  ) {

                      throw new Error(
                          `${name}/${item.id} ima nevalidan views.`
                      );

                  }


                  if (item.views < 0) {

                      throw new Error(
                          `${name}/${item.id} ima negativan views.`
                      );

                  }

              }

          }


          console.log(
              "✅ JSON je validan."
          );


          console.log(
              "Today:",
              data.today.length
          );


          console.log(
              "Last 30 Days:",
              data.last30Days.length
          );


          console.log(
              "All Time:",
              data.allTime.length
          );

          NODE


      # =====================================================
      # 9. GIT IDENTITET
      # =====================================================

      - name: Podesi Git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # =====================================================
      # 10. FETCH NAJNOVIJEG MAIN
      # =====================================================

      - name: Osvezi main pre commita

        run: |

          echo "=========================================="
          echo "OSVEZAVANJE MAIN"
          echo "=========================================="


          git fetch origin main


          echo ""

          echo "Remote main:"

          git rev-parse origin/main


          echo ""

          echo "Local main:"

          git rev-parse HEAD


          echo ""

          echo "Rebase na najnoviji origin/main..."


          git rebase origin/main


      # =====================================================
      # 11. COMMIT
      # =====================================================

      - name: Commituj popular.json

        run: |

          echo "=========================================="
          echo "COMMIT popular.json"
          echo "=========================================="


          git add popular.json


          if git diff --cached --quiet; then

            echo "ℹ️ Nema promena."

            echo "popular.json je isti kao u repository-ju."

          else

            git commit -m "Update popular.json"

            echo "✅ Commit napravljen."

          fi


      # =====================================================
      # 12. PUSH SA AUTOMATSKIM REBASE-OM
      # =====================================================

      - name: Push popular.json

        run: |

          echo "=========================================="
          echo "PUSH NA GITHUB"
          echo "=========================================="


          MAX_ATTEMPTS=5

          ATTEMPT=1


          while [ $ATTEMPT -le $MAX_ATTEMPTS ]

          do

            echo ""

            echo "------------------------------------------"

            echo "Pokusaj $ATTEMPT od $MAX_ATTEMPTS"

            echo "------------------------------------------"


            # -------------------------------------------------
            # UVEK OSVEZI REMOTE PRE PUSH-A
            # -------------------------------------------------

            git fetch origin main


            # -------------------------------------------------
            # PROVERI DA LI POSTOJE NEPOVEZANI COMMITI
            # -------------------------------------------------

            if ! git merge-base --is-ancestor HEAD origin/main; then

              echo "Remote main ima nove commit-e."

              echo "Radim rebase..."


              git rebase origin/main

            fi


            # -------------------------------------------------
            # POKUSAJ PUSH
            # -------------------------------------------------

            if git push origin HEAD:main; then

              echo ""

              echo "=========================================="

              echo "✅ PUSH USPESAN"

              echo "=========================================="


              exit 0

            fi


            echo ""

            echo "⚠️ Push nije uspeo."

            echo "Remote se verovatno promenio."

            echo "Ponovicu..."


            ATTEMPT=$((ATTEMPT + 1))


            sleep 3

          done


          echo ""

          echo "=========================================="

          echo "❌ PUSH NIJE USPEO"

          echo "=========================================="


          exit 1


      # =====================================================
      # 13. KRAJ
      # =====================================================

      - name: Zavrseno

        run: |

          echo ""

          echo "=========================================="

          echo "SVE NA DLANU - POPULARNO"

          echo "=========================================="


          echo "✅ Google credentials"

          echo "✅ Google OAuth"

          echo "✅ GA4 Data API"

          echo "✅ GA4 Property"

          echo "✅ Today"

          echo "✅ Last 30 Days"

          echo "✅ All Time"

          echo "✅ TOP 10"

          echo "✅ popular.json"

          echo "✅ JSON validacija"

          echo "✅ GitHub commit"

          echo "✅ GitHub push"


          echo ""

          echo "Automatsko pokretanje:"

          echo "svaki dan u 09:30 UTC"


          echo ""

          echo "=========================================="
